<!DOCTYPE html>
<html>
<head>
  <title>Google OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }
    .status {
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .processing {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    #debug {
      font-size: 12px;
      text-align: left;
      background: white;
      padding: 10px;
      border-radius: 4px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="status" class="status processing">
    <h3>🔄 Processando autenticação...</h3>
    <p>Por favor aguarde...</p>
  </div>
  <div id="debug"></div>
  
  <script>
    const debugDiv = document.getElementById('debug');
    const statusDiv = document.getElementById('status');
    
    function log(message) {
      console.log(message);
      debugDiv.innerHTML += '<p>' + message + '</p>';
    }
    
    function updateStatus(type, title, message) {
      statusDiv.className = `status ${type}`;
      statusDiv.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
    }
    
    const urlParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = urlParams.get('access_token');
    const error = urlParams.get('error');

    if (error) {
      updateStatus('error', 'Erro na autenticação', `Erro: ${error}`);
      window.opener?.postMessage({
        type: 'GOOGLE_AUTH_ERROR',
        error: error
      }, window.location.origin);
    } else if (accessToken) {
      updateStatus('success', 'Autenticação realizada!', 'Esta janela irá fechar automaticamente...');
      window.opener?.postMessage({
        type: 'GOOGLE_AUTH_SUCCESS',
        access_token: accessToken
      }, window.location.origin);
    } else {
      updateStatus('error', 'Token não encontrado', 'Nenhum token de acesso foi recebido');
      window.opener?.postMessage({
        type: 'GOOGLE_AUTH_ERROR',
        error: 'No access token received'
      }, window.location.origin);
    }
    
    setTimeout(() => {
      window.close();
    }, accessToken ? 1500 : 3000);
  </script>
</body>
</html>
